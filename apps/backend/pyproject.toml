[project]
name = "slovo-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "arq>=0.27.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "beautifulsoup4>=4.13.3",
    "ebooklib>=0.20",
    "fastapi[standard]",
    "hiredis>=3.3.1",
    "httpx>=0.28.1",
    "lxml>=5.3.1",
    "newspaper4k>=0.9.3.1",
    "trafilatura>=2.0.0",
    "pydantic==2.11.1",
    "pydantic-settings==2.8.1",
    "pyjwt>=2.12.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.46",
    "sse-starlette>=3.0.3",
    "yt-dlp>=2024.12.13",
    "pypdf>=5.0.0",
    "pypinyin>=0.53.0",
    "stanza==1.10.1",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "black==24.1.1",
    "greenlet>=3.3.2",
    "httpx>=0.27",
    "isort==5.13.2",
    "mypy==1.8.0",
    "pre-commit==3.6.0",
    "pytest==8.0.0",
    "pytest-asyncio==0.23.5",
    "pytest-cov>=4.1.0",
    "ruff>=0.11.2",
]

[tool.uv]
default-groups = "all"

[tool.ty.environment]
python = "./.venv/bin/python"
