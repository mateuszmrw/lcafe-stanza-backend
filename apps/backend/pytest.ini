[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    migration: marks tests as migration tests (deselect with '-m "not migration"')
    e2e: marks end-to-end tests that require a running docker compose stack (deselect with '-m "not e2e"')
addopts = --strict-markers
