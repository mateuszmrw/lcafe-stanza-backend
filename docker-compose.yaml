services:
  postgresql:
    image: postgres:15-alpine
    container_name: postgresql-stanza
    restart: unless-stopped
    networks:
      - slovo-local
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-db}
      POSTGRES_USER: ${DB_USERNAME:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-user} -d ${DB_DATABASE:-db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: redis-slovo
    restart: unless-stopped
    networks:
      - slovo-local
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: docker/Dockerfile
    container_name: slovo-backend
    restart: unless-stopped
    networks:
      - traefik
      - slovo-local
    ports:
      - "8678:8678"
    environment:
      debug: "true"
      use_gpu: "false"
      db_host: postgresql
      db_port: "5432"
      db_database: ${DB_DATABASE:-db}
      db_username: ${DB_USERNAME:-user}
      db_password: ${DB_PASSWORD:-password}
      jwt_secret: ${jwt_secret:-change-me-in-production}
      db_encryption_key: ${db_encryption_key:-change-me-in-production}
      redis_url: redis://redis:6379
      admin_email: ${ADMIN_EMAIL:-}
      admin_password: ${ADMIN_PASSWORD:-}
      deepl_api_key: ${DEEPL_API_KEY:-}
    volumes:
      - stanza_models:/app/stanza_resources
      - storage:/app/storage
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.slovo-backend.rule=Host(`sl-backend.mrw.ovh`)"
      - "traefik.http.routers.slovo-backend.entrypoints=websecure"
      - "traefik.http.routers.slovo-backend.tls.certresolver=ovh"
      - "traefik.http.services.slovo-backend.loadbalancer.server.port=8678"

  arq-worker:
    build:
      context: ./apps/backend
      dockerfile: docker/Dockerfile
    container_name: slovo-arq-worker
    restart: unless-stopped
    command: ["/app/.venv/bin/arq", "src.worker.settings.WorkerSettings"]
    environment:
      debug: "false"
      languages: '["english", "russian", "polish"]'
      use_gpu: "false"
      db_host: postgresql
      db_port: "5432"
      db_database: ${DB_DATABASE:-db}
      db_username: ${DB_USERNAME:-user}
      db_password: ${DB_PASSWORD:-password}
      jwt_secret: ${jwt_secret:-change-me-in-production}
      db_encryption_key: ${db_encryption_key:-change-me-in-production}
      redis_url: redis://redis:6379
      deepl_api_key: ${DEEPL_API_KEY:-}
    volumes:
      - stanza_models:/app/stanza_resources
      - storage:/app/storage
    networks:
      - slovo-local
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      # Context is the monorepo root — needed so Docker can access the root
      # package-lock.json (npm workspaces keeps a single lockfile at root).
      context: ./
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the JS bundle at build time — must be a URL the browser
        # can reach. port 8678 is published on the host, so localhost works.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8678}
    container_name: slovo-web
    networks:
      - traefik
      - slovo-local
    restart: unless-stopped
    ports:
      - "4412:3000"
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.slovo-web.rule=Host(`slovo.mrw.ovh`)"
      - "traefik.http.routers.slovo-web.entrypoints=websecure"
      - "traefik.http.routers.slovo-web.tls.certresolver=ovh"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  stanza_models:
    driver: local
  storage:
    driver: local

networks:
  traefik:
    external: true
  slovo-local:
    internal: true
