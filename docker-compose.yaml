services:
  postgresql:
    image: postgres:15-alpine
    container_name: postgresql-stanza
    restart: unless-stopped
    networks:
      - slovo-local
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-db}
      POSTGRES_USER: ${DB_USERNAME:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-user} -d ${DB_DATABASE:-db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: redis-slovo
    restart: unless-stopped
    networks:
      - slovo-local
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: docker/Dockerfile
    container_name: slovo-backend
    restart: unless-stopped
    networks:
      - slovo-local
    ports:
      - "8678:8678"
    environment:
      DEBUG: "true"
      USE_GPU: "false"
      DB_HOST: postgresql
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-db}
      DB_USERNAME: ${DB_USERNAME:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      # JWT_SECRET and DB_ENCRYPTION_KEY must be 32+ chars — validated at startup.
      # Generate with: openssl rand -base64 32
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required, must be 32+ chars}
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY:?DB_ENCRYPTION_KEY is required, must be 32+ chars}
      REDIS_URL: redis://redis:6379
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
    volumes:
      - stanza_models:/app/stanza_resources
      - storage:/app/storage
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

  arq-worker:
    build:
      context: ./apps/backend
      dockerfile: docker/Dockerfile
    container_name: slovo-arq-worker
    restart: unless-stopped
    command: ["/app/.venv/bin/arq", "src.worker.settings.WorkerSettings"]
    environment:
      DEBUG: "false"
      LANGUAGES: '["english", "russian", "polish"]'
      USE_GPU: "false"
      DB_HOST: postgresql
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-db}
      DB_USERNAME: ${DB_USERNAME:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required, must be 32+ chars}
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY:?DB_ENCRYPTION_KEY is required, must be 32+ chars}
      REDIS_URL: redis://redis:6379
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
    volumes:
      - stanza_models:/app/stanza_resources
      - storage:/app/storage
    networks:
      - slovo-local
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      # Context is the monorepo root — needed so Docker can access the root
      # package-lock.json (npm workspaces keeps a single lockfile at root).
      context: ./
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the JS bundle at build time — must be a URL the browser
        # can reach. port 8678 is published on the host, so localhost works.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8678}
    container_name: slovo-web
    networks:
      - slovo-local
    restart: unless-stopped
    ports:
      - "4412:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  stanza_models:
    driver: local
  storage:
    driver: local

networks:
  slovo-local:
    internal: true
